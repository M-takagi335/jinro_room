<style>
:root{color-scheme:dark;--bg:#14151c;--panel:#22232e;--line:#5d5364;--ink:#f2e9df;--muted:#c7bdc9;--gold:#e9c486;--blue:#9db5cf;font:16px/1.6 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(ellipse at 70% 0,#312736,var(--bg) 59%)}main{width:min(1120px,100%);margin:auto;padding:clamp(14px,4vw,42px)}h1,h2,h3,p{margin:0}h1,h2{font-family:"Yu Mincho","Hiragino Mincho ProN",serif}h1{letter-spacing:.11em}h2{font-size:1.55rem}button,select{font:inherit;color:var(--ink);background:#33303d;border:1px solid #78677e;border-radius:5px;padding:7px 12px;min-height:44px}button{cursor:pointer}button:hover:not(:disabled){background:#484052;border-color:var(--gold)}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.primary{background:#69464c;border-color:#bd896d;font-weight:700}.muted,small{color:var(--muted)}small{font-size:.78rem}.bar{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:12px}.bar h1{font-size:1.4rem;margin-right:auto}.bar b{color:var(--gold)}.bar p{font-size:.9rem}
.cover,.stage{position:relative;isolation:isolate;overflow:hidden;border:1px solid var(--line);border-radius:7px;background:linear-gradient(0deg,#15151e,transparent 75%),radial-gradient(ellipse at 50% 20%,#4a3a4a,#22232f 75%)}.cover{min-height:min(670px,85vh);display:grid;place-items:center;text-align:center;padding:25px}.window{position:absolute;z-index:-1;top:9%;left:12%;width:30%;height:65%;border:5px solid #545365;border-radius:48% 48% 0 0;opacity:.7;background:radial-gradient(circle at 64% 30%,#dfd0ba 0 7%,transparent 8%),linear-gradient(90deg,transparent 47%,#4c4c60 48% 51%,transparent 52%),linear-gradient(0deg,transparent 48%,#4c4c60 49% 51%,transparent 52%),linear-gradient(#36495f,#777284 72%,#424357)}.cover-text{padding:22px 26px;background:#171721e8;border:1px solid #736274;border-radius:7px}.cover h1{font-size:clamp(2.8rem,9vw,5.5rem);color:var(--gold)}.cover button{margin-top:18px}
.interview{display:grid;grid-template-columns:1.45fr 1fr;gap:14px}.stage{--figure:#20212b;--rim:#758499;min-height:480px;display:flex;align-items:end;padding:18px}.stage-mio{--rim:#aa8c94}.stage-so{--rim:#899c89}.stage-towa{--rim:#b19b78}.stage-yui{--rim:#aa96b3}.figure{position:absolute;z-index:-1;left:50%;bottom:15%;width:clamp(180px,48%,320px);height:72%;transform:translateX(-50%);filter:drop-shadow(2px 1px 1px var(--rim))}.figure i{position:absolute;top:0;left:31%;width:40%;height:42%;border-radius:46% 51% 47% 48%;background:var(--figure)}.figure b{position:absolute;inset:35% 0 0;border-radius:40% 43% 13% 13%;background:linear-gradient(90deg,var(--figure),#292832,var(--figure))}.figure-mio i,.figure-yui i{left:29%;width:46%;height:56%;border-radius:48% 50% 35% 32%}.figure-so b{inset:33% 0 0;border-radius:24% 25% 12% 12%}.figure-towa i::after{content:"";position:absolute;left:42%;top:47%;width:59%;height:15%;border:2px solid var(--rim);border-radius:4px}.figure-ren i::after{content:"";position:absolute;inset:0 0 auto -8%;height:46%;background:#181821;border-radius:56% 60% 24% 45%}.figure-yui b::after{content:"";position:absolute;top:53%;right:15%;width:18%;height:20%;border:3px solid #7d6558;background:#ceb17e;border-radius:9px;box-shadow:0 0 18px #c2a57266}
.dialogue{width:100%;min-height:112px;padding:12px 15px;border:1px solid #827189;border-radius:5px;background:#191923f2}.dialogue h2{color:var(--gold);margin-bottom:4px}.dialogue small{margin-left:12px}.questions,.panel{padding:clamp(13px,3vw,24px);border:1px solid var(--line);border-radius:7px;background:var(--panel)}.choices{display:grid;gap:7px;margin:10px 0}.choices button{text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}.choices small{white-space:nowrap}.questions .primary{margin-top:12px}.panel p,.panel h3{margin:8px 0}.panel ul,.panel ol{padding-left:24px}.panel li+li{margin-top:5px}.panel button+button{margin-left:8px}.notebook{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.notebook article{border:1px solid var(--line);padding:12px;border-radius:5px;background:#1d1e28}.notebook h3{color:var(--gold);margin-top:0}.notebook dd{margin:3px 0 8px 12px;color:var(--muted)}.notebook dt{font-weight:600}.verdict-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.verdict-fields select{display:block;width:100%}.win h2{color:var(--gold)}.loss h2{color:#f3aeb3}#form-message{color:#f3aeb3}#rules{margin-bottom:12px}
@media(max-width:730px){.interview{grid-template-columns:1fr}.stage{min-height:340px}.figure{width:clamp(165px,42%,240px)}.bar h1{margin-right:0}.bar p{flex:1}.stage{padding:10px}.dialogue{min-height:100px}}@media(max-width:480px){.notebook,.verdict-fields{grid-template-columns:1fr}.cover-text{padding:16px}.bar button{padding-inline:8px}}
.case-list{display:grid;gap:8px;margin:12px 0}.case-list button{margin-left:0!important;text-align:left}.case-list small{display:block}.public-record{margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--gold);background:var(--panel);color:var(--gold)}

<body>
<main id="app"></main>
<script>
(() => {
  'use strict';
  const roles = ['村人', '占い師', '狩人', '記録係', '人狼'];
  const seats = ['村人', '村人', ...roles.slice(1)];
  const people = [
    { id: 'you', name: 'あなた' },
    { id: 'ren', name: '蓮', description: '濡れた手袋を外し、燭台に目を向ける。' },
    { id: 'mio', name: '澪', description: '長椅子の端に座り、窓の方を気にしている。' },
    { id: 'so', name: '奏', description: '戸口にもたれ、廊下の物音に耳を澄ませている。' },
    { id: 'towa', name: '十和', description: '膝の上で革表紙の帳面を開く。' },
    { id: 'yui', name: '結', description: 'ランタンを置き、両手を膝の上で重ねる。' }
  ];
  const order = people.slice(1);
  const name = id => people.find(person => person.id === id)?.name;
  const bell = '三つ目の鐘';
  const locations = { you: '北の礼拝堂', ren: '中庭', mio: '中庭', so: '礼拝堂の戸口', towa: '中庭', yui: '北の礼拝堂' };
  const guard = { target: 'you', event: '外廊下で板がきしんだ。戸口を越える者はいなかった。', seen: null };
  const ledger = { target: 'ren', place: locations.ren, action: '雨戸を閉めていた' };
  const sightings = {
    mio: { target: 'ren', place: locations.ren, action: '雨戸に手をかけていた' },
    yui: { target: 'you', place: locations.you, action: '火の消えたランタンを持っていた' }
  };
  const rules = [
    '役職の内訳は村人2人、占い師・狩人・記録係・人狼が各1人。あなたもこの6人に含まれます。',
    '人狼以外は知っている事実と自分の役職を正直に話します。人狼は真実も嘘も話せます。',
    '昨夜の三つ目の鐘は一度だけ鳴りました。その瞬間、同じ人物が離れた二つの場所にいることはできません。',
    '役職の確認は無料です。ほかの質問は全員で8回まで。一度会話を終えた相手には戻れません。'
  ];
  const common = [
    ['night', '昨夜は何をしていましたか？'],
    ['about', '私について何か知っていますか？'],
    ['suspect', '誰が怪しいと思いますか？']
  ];
  const specialties = {
    村人: [['seen', '昨夜、誰を見ましたか？'], ['where', 'どこで見ましたか？'],
      ['doing', 'その人は何をしていましたか？'], ['seenMe', '私を見かけましたか？']],
    占い師: [['divined', '誰を占いましたか？'], ['reading', '占い結果は何でしたか？'],
      ['divinedMe', '私を占いましたか？'], ['ritual', '占いの状況を詳しく教えてください。']],
    狩人: [['guarded', '誰を守りましたか？'], ['incident', '護衛中に何か起きましたか？'],
      ['guardSeen', '誰かを見かけましたか？'], ['guardedMe', '私を守りましたか？']],
    記録係: [['logged', '誰の行動を記録しましたか？'], ['logWhere', 'その人物はどこにいましたか？'],
      ['logMe', '私の行動記録はありますか？'], ['compare', '誰かの証言と記録が食い違っていますか？']],
    人狼: []
  };
  const claimQuestion = ['claim', 'あなたの役職は何ですか？'];
  const position = (person, place) => ({ kind: 'place', person, place, time: bell });
  const roleFact = (person, role) => ({ kind: 'role', person, role });
  const say = (text, ...facts) => ({ text, facts });
  const unknown = () => say('それについては知りません。');
  const at = (id, place) => say(bell + 'が鳴った時、' + name(id) + 'は' + place + 'にいました。', position(id, place));

  const cases = [
    {
      id: 'storm', title: '雨戸の証言', hint: '鐘が鳴った瞬間の居場所を照合する。',
      actual: { you: '占い師', ren: '人狼', mio: '村人', so: '狩人', towa: '記録係', yui: '村人' },
      assumed: { ren: '占い師' }, reader: 'you', reading: 'ren', forgedReading: true,
      conclusion: '残るNPCは村人2人、狩人1人、記録係1人。空いているのは占い師だけ。'
    },
    {
      id: 'seal', title: '銀の封印', hint: '館の検査記録と、昨夜の占いを照合する。',
      actual: { you: '人狼', ren: '占い師', mio: '村人', so: '狩人', towa: '記録係', yui: '村人' },
      assumed: {}, reader: 'ren', reading: 'you',
      verified: { person: 'ren', text: '公開検査記録 · 銀の封印を通過した蓮は人狼ではありません。この判定は確実です。' }
    },
    {
      id: 'guard', title: '閉ざされた戸口', hint: '護衛の話と、同じ時刻の目撃を照合する。',
      actual: { you: '狩人', ren: '人狼', mio: '村人', so: '占い師', towa: '記録係', yui: '村人' },
      assumed: { ren: '狩人' }, reader: 'so', reading: 'yui',
      conclusion: '残るNPCは村人2人、占い師1人、記録係1人。空いているのは狩人だけ。'
    }
  ];
  const catalog = cases.map(({ id, title, hint }) => ({ id, title, hint }));
  const falsePlace = '西の書斎';

  function answer(scenario, id, question, history) {
    const { actual, assumed, reader, reading, forgedReading } = scenario;
    const liar = actual[id] === '人狼';
    const sight = sightings[id];
    const divination = liar && forgedReading
      ? { target: 'you', role: '人狼', place: falsePlace }
      : { target: reading, role: actual[reading], place: locations[reader] };
    const protectedPerson = liar ? 'mio' : guard.target;
    switch (question) {
      case 'claim': {
        const role = assumed[id] || actual[id];
        return say('私は' + role + 'です。', roleFact(id, role));
      }
      case 'night':
        return liar
          ? say(bell + 'が鳴った時は、' + falsePlace + 'にいました。', position(id, falsePlace))
          : say(bell + 'の時は、' + locations[id] + 'にいました。', position(id, locations[id]));
      case 'about':
        if (id === 'ren') return say('今朝、暖炉のそばで目を覚ましたのを見ました。');
        if (actual[id] === '狩人') return say('昨夜、あなたのそばにいました。護衛の依頼があったので。');
        if (sight?.target === 'you') return at('you', sight.place);
        return unknown();
      case 'suspect':
        return say('私の見聞きしたことだけでは、誰が怪しいかは判断できません。');
      case 'seen':
        return say(name(sight.target) + 'を見ました。' + bell + 'が鳴った時です。');
      case 'where':
        return at(sight.target, sight.place);
      case 'doing':
        return say(name(sight.target) + 'が' + sight.action + 'のを見ました。', position(sight.target, sight.place));
      case 'seenMe':
        return sight.target === 'you' ? at('you', sight.place) : say('私が覚えている目撃に、あなたは含まれていません。');
      case 'divined':
        return say('占ったのは' + name(divination.target) + 'です。');
      case 'reading':
        return say('水盤に映った役職は、' + name(divination.target) + 'が' + divination.role + '。', roleFact(divination.target, divination.role));
      case 'divinedMe':
        return say(divination.target === 'you' ? 'ええ。昨夜はあなたを占いました。' : 'いいえ。昨夜は別の人を占いました。');
      case 'ritual':
        return say(bell + 'が鳴った瞬間に、' + divination.place + 'で水盤をのぞきました。', position(id, divination.place));
      case 'guarded':
        return say('護衛したのは' + name(protectedPerson) + 'です。');
      case 'incident':
        return liar ? say(bell + 'の時は、西の書斎の戸口にいました。', position(id, falsePlace)) : say(guard.event);
      case 'guardSeen':
        return guard.seen ? say(guard.seen) : say('顔を確認できた人はいません。');
      case 'guardedMe':
        return say(protectedPerson === 'you' ? 'はい。昨夜、あなたを護衛しました。' : 'いいえ。昨夜は別の人を護衛しました。');
      case 'logged':
        return say('帳面に記したのは' + name(ledger.target) + 'です。' + bell + 'の時に' + ledger.action + '。');
      case 'logWhere':
        return at(ledger.target, ledger.place);
      case 'logMe':
        return say('昨夜の帳面に、あなたの行動は記されていません。');
      case 'compare': {
        const differs = history.some(entry => entry.facts.some(fact => fact.kind === 'place' &&
          fact.person === ledger.target && fact.time === bell && fact.place !== ledger.place));
        const entry = at(ledger.target, ledger.place);
        return differs ? say('今聞かせてもらった話とは食い違います。' + entry.text, ...entry.facts) : entry;
      }
      default:
        return unknown();
    }
  }

  function enumerate(ids, remaining, layout = {}) {
    if (!ids.length) return [layout];
    return [...new Set(remaining)].flatMap(role => {
      const rest = [...remaining];
      rest.splice(rest.indexOf(role), 1);
      return enumerate(ids.slice(1), rest, { ...layout, [ids[0]]: role });
    });
  }
  const layouts = enumerate(people.map(person => person.id), seats);

  function infer(entries) {
    return layouts.filter(layout => {
      const positions = new Map();
      for (const entry of entries) {
        if (layout[entry.speaker] === '人狼') continue;
        for (const fact of entry.facts) {
          if (fact.kind === 'notWolf' && layout[fact.person] === '人狼') return false;
          if (fact.kind === 'role' && layout[fact.person] !== fact.role) return false;
          if (fact.kind === 'place') {
            const key = fact.time + ':' + fact.person;
            if (positions.has(key) && positions.get(key) !== fact.place) return false;
            positions.set(key, fact.place);
          }
        }
      }
      return true;
    }).map(layout => ({ ...layout }));
  }

  function createGame(caseId = 'storm') {
    const scenario = cases.find(entry => entry.id === caseId) || cases[0];
    const { actual, verified } = scenario;
    const publicEvidence = verified ? [{ facts: [{ kind: 'notWolf', person: verified.person }] }] : [];
    let index = 0;
    let remaining = 8;
    let phase = 'conversation';
    let result = null;
    const transcript = [];
    const claims = {};
    const notes = {};

    function available() {
      if (phase !== 'conversation') return [];
      const id = order[index].id;
      if (!claims[id]) return [claimQuestion];
      const asked = new Set(transcript.filter(entry => entry.speaker === id).map(entry => entry.id));
      return [...common, ...specialties[claims[id]]].filter(([question]) => !asked.has(question));
    }

    return {
      view() {
        const possible = infer([...publicEvidence, ...transcript]);
        const candidates = Object.fromEntries(people.map(({ id }) =>
          [id, roles.filter(role => possible.some(layout => layout[id] === role))]));
        return JSON.parse(JSON.stringify({
          phase, caseId: scenario.id, caseTitle: scenario.title, publicRecord: verified?.text, index, current: phase === 'conversation' ? order[index] : null, rules, people, roles,
          remaining, claims, notes, transcript, candidates, layouts: possible.length, result,
          questions: available().map(([id, text]) => ({ id, text, cost: Number(id !== 'claim') }))
        }));
      },
      ask(question) {
        const option = available().find(([id]) => id === question);
        if (!option || (question !== 'claim' && remaining === 0)) return false;
        const speaker = order[index].id;
        const reply = answer(scenario, speaker, question, transcript);
        if (question === 'claim') claims[speaker] = reply.facts[0].role;
        else remaining--;
        transcript.push({ speaker, id: question, question: option[1], ...reply });
        return true;
      },
      next() {
        if (phase !== 'conversation' || !claims[order[index].id]) return false;
        index++;
        if (index === order.length) phase = 'verdict';
        return true;
      },
      note(id, role) {
        if (phase === 'result' || !people.some(person => person.id === id) || (role !== '' && !roles.includes(role))) return false;
        notes[id] = role;
        return true;
      },
      submit(self, guesses = {}) {
        if (phase !== 'verdict' || !roles.includes(self)) return false;
        const optional = order.filter(person => roles.includes(guesses[person.id]));
        const wolf = people.find(person => actual[person.id] === '人狼');
        const lies = [];
        if (wolf.id !== 'you') {
          lies.push(
            { questions: '役職確認', text: wolf.name + 'は' + scenario.assumed[wolf.id] + 'を名乗った。実際には人狼。', ids: ['claim'] },
            { questions: '昨夜の行動', text: '西の書斎にいたと話したが、鐘の時は中庭にいた。', ids: ['night', 'ritual', 'incident'] }
          );
          if (scenario.forgedReading) lies.push({
            questions: '占いの対象・結果', text: 'あなたを占い、人狼と出たと話したが、蓮は誰も占っていない。',
            ids: ['divined', 'reading', 'divinedMe']
          });
          else lies.push({
            questions: '護衛対象', text: '澪を護衛したという偽の申告。蓮は護衛をしていない。', ids: ['guarded', 'guardedMe']
          });
        }
        const knowledge = {
          you: '鐘の時は北の礼拝堂にいた。目覚めた時には役職の記憶を失っていた。',
          ren: '鐘の時は中庭で雨戸を閉めていた。今朝あなたが目覚めるところを見た。',
          mio: '鐘の時に中庭で蓮が雨戸に手をかけるのを見た。',
          so: '鐘の時は礼拝堂の戸口にいた。',
          towa: '鐘の時に蓮が中庭で雨戸を閉めたことを帳面に記録した。',
          yui: '鐘の時に北の礼拝堂であなたが火の消えたランタンを持っているのを見た。'
        };
        knowledge[scenario.reader] += name(scenario.reading) + 'を占い、' + actual[scenario.reading] + 'と出た。';
        const hunter = people.find(person => actual[person.id] === '狩人').id;
        knowledge[hunter] += (hunter === 'you' ? '澪' : 'あなた') + 'を護衛していた。' + guard.event;
        const explanation = verified ? [
          '公開検査記録で、蓮が人狼ではないと確定している。',
          '蓮は占い師を名乗り、占い結果ではあなたが人狼だったと答える。人狼以外は知っていることを正直に話す。',
          'したがって、この事件でのあなたの役職は人狼。'
        ] : [
          '蓮に「昨夜の行動」を聞く。蓮は三つ目の鐘の時に西の書斎にいたと言う。',
          '澪には「どこで見ましたか？」、十和には「その人物はどこにいましたか？」を聞く。二人とも同じ鐘の時に蓮が中庭にいたと答える。',
          '蓮が正直なら、澪と十和の両方が嘘をついたことになる。人狼は一人なので、蓮が人狼。',
          scenario.conclusion
        ];
        result = {
          won: self === actual.you, self, roles: actual,
          lies: lies.map(lie => ({ ...lie, heard: transcript.some(entry => entry.speaker === wolf.id && lie.ids.includes(entry.id)) })),
          answered: optional.length, score: optional.filter(person => guesses[person.id] === actual[person.id]).length,
          events: '三つ目の鐘が鳴った時、あなたは北の礼拝堂、蓮は中庭にいた。今朝、蓮は暖炉のそばであなたが目を覚ますのを見た。',
          knowledge, explanation
        };
        phase = 'result';
        return true;
      }
    };
  }

  const api = { createGame, infer, catalog };
  if (typeof module === 'object' && module.exports) module.exports = api;
  else globalThis.Mansion = api;
})();

(() => {
  'use strict';
  const root = document.querySelector('#app');
  let game;
  let screen = 'title';
  let showNote = false;
  let tab = 'result';
  let selectedCase = 'storm';
  const guesses = {};
  const escape = value => String(value).replace(/[&<>"']/g, key =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[key]);
  const button = (action, label, value = '', classes = '', disabled = false) =>
    `<button type="button" data-act="${action}" data-value="${value}" class="${classes}" ${disabled ? 'disabled' : ''}>${label}</button>`;
  const labelRole = role => escape(role || '未回答');
  function roleSelect(state, id, mode, value) {
    return `<select data-mode="${mode}" data-id="${id}" ${state.phase === 'result' ? 'disabled' : ''}>
      <option value="">${mode === 'note' ? '仮説なし' : '未選択'}</option>
      ${state.roles.map(role => `<option ${role === value ? 'selected' : ''}>${escape(role)}</option>`).join('')}</select>`;
  }

  function conversation(state) {
    const { current } = state;
    const replies = state.transcript.filter(entry => entry.speaker === current.id);
    const last = replies.at(-1);
    return `<div class="interview">
      <section class="stage stage-${current.id}" aria-label="${current.name}との会話">
        <div class="window" aria-hidden="true"></div>
        <div class="figure figure-${current.id}" aria-hidden="true"><i></i><b></b></div>
        <div class="dialogue" role="status"><h2>${current.name}<small>${state.claims[current.id] ? '自称 ' + state.claims[current.id] : ''}</small></h2>
          ${last ? `<p>${escape(last.text)}</p>` : `<p class="muted">${escape(current.description)}</p>`}</div>
      </section>
      <section class="questions"><h2>質問を選ぶ</h2>
        <div class="choices">${state.questions.length ? state.questions.map(question =>
          button('ask', escape(question.text) + '<small>' + (question.cost ? '1回' : '無料') + '</small>',
            question.id, '', question.cost > state.remaining)).join('') : '<p>この相手への質問はすべて済みました。</p>'}</div>
        <p class="muted">${state.remaining === 0 ? '有料の質問は終了です。残りの役職確認はできます。' : '会話を終えると、この相手には戻れません。'}</p>
        ${button('next', state.index === 4 ? '最終回答へ' : '次の人との会話へ', '', 'primary', !state.claims[current.id])}
      </section></div>`;
  }

  function notebook(state) {
    return `<section class="panel"><h2>推理ノート</h2>
      <p class="muted">公開された内訳と証言に合う配置は ${state.layouts} 通り。候補は証言が増えると更新されます。仮説は自分用のメモです。</p>
      <div class="notebook">${state.people.map(person => {
        const entries = state.transcript.filter(entry => entry.speaker === person.id);
        return `<article><h3>${person.name}${person.id === 'you' ? '' : ' <small>自称 ' + escape(state.claims[person.id] || '未確認') + '</small>'}</h3>
          <p>役職候補 · ${state.candidates[person.id].join('、') || 'なし'}</p>
          <label>自分の仮説 ${roleSelect(state, person.id, 'note', state.notes[person.id])}</label>
          ${entries.length ? '<dl>' + entries.map(entry => '<dt>' + escape(entry.question) + '</dt><dd>' +
            escape(entry.text) + '</dd>').join('') + '</dl>' : ''}</article>`;
      }).join('')}</div></section>`;
  }

  function verdict(state) {
    return `<section class="panel verdict"><h2>あなたは何者だった？</h2>
      <p class="muted">自分の役職を選んでください。ほかの5人については、分かる範囲で回答できます。</p>
      <form id="verdict"><div class="verdict-fields">${state.people.map(person => `<label>${person.name}${person.id === 'you' ? '（必須）' : '（任意）'}
        ${roleSelect(state, person.id, 'guess', guesses[person.id] ?? state.notes[person.id])}</label>`).join('')}</div>
      <button type="submit" class="primary">回答を確定する</button><p id="form-message" role="status"></p></form></section>`;
  }

  function result(state) {
    const r = state.result;
    if (tab === 'explanation') {
      return `<section class="panel"><h2>事件の解説</h2>
        <p>${escape(r.events)}</p><h3>証言をどう照合するか</h3>
        <ol>${r.explanation.map(step => '<li>' + escape(step) + '</li>').join('')}</ol>
        <h3>各人物が知っていたこと</h3>
        <ul>${state.people.map(person => '<li><strong>' + person.name + '</strong> · ' + escape(r.knowledge[person.id]) + '</li>').join('')}</ul>
        <h3>人狼の嘘</h3>${r.lies.length ? '<ul>' + r.lies.map(lie => '<li><strong>' + escape(lie.questions) + '</strong> · ' + escape(lie.text) +
          ' <small>（' + (lie.heard ? '質問済み' : '会話では未確認') + '）</small></li>').join('') + '</ul>' :
          '<p>この事件では、聞き取り相手の5人は全員、知っていることを正直に話しました。</p>'}
        ${button('result', '結果へ戻る')}${button('retry', 'この事件をやり直す', '', 'primary')}${button('cases', '別の事件を選ぶ')}</section>`;
    }
    return `<section class="panel result ${r.won ? 'win' : 'loss'}">
      <h2>${r.won ? '正解 · 記憶の手がかりを掴んだ' : '不正解 · 証言を見直そう'}</h2>
      <p>あなたの回答は ${escape(r.self)}。真の役職は ${escape(r.roles.you)}。</p>
      <p>NPCの役職は5人中${r.score}人正解（${r.answered}人に回答）。</p>
      <ul>${state.people.map(person => '<li>' + escape(person.name) + ' · ' + labelRole(r.roles[person.id]) + '</li>').join('')}</ul>
      ${button('explanation', '事件の解説を読む', '', 'primary')}${button('retry', 'この事件をやり直す')}${button('cases', '別の事件を選ぶ')}</section>`;
  }

  function render(focus) {
    if (!game) {
      root.innerHTML = screen === 'title' ? `<section class="cover">
        <div class="window" aria-hidden="true"></div><div class="cover-text"><h1>人狼の館</h1>
        <p>記憶を失ったあなたの前に、五人が待っている。<br>互いの証言を聞き、あなた自身の役職を突き止める。</p>
        ${button('intro', '目を覚ます', '', 'primary')}</div></section>`
        : `<section class="panel intro"><h1>昨夜、何があった？</h1>
          <p>聞き取りは一人ずつ。役職を名乗ってもらうと、その申告に応じた質問が開きます。</p>
          <ul>${Mansion.createGame().view().rules.map(rule => '<li>' + escape(rule) + '</li>').join('')}</ul>
          <h2>事件を選ぶ</h2><div class="case-list">${Mansion.catalog.map(entry =>
            button('start', '<strong>' + escape(entry.title) + '</strong><small>' + escape(entry.hint) + '</small>', entry.id)).join('')}</div>
          ${button('title', 'タイトルへ')}</section>`;
    } else {
      const state = game.view();
      root.innerHTML = `<header class="bar"><h1>人狼の館</h1>
        <p>${escape(state.caseTitle)} · ${state.phase === 'conversation' ? (state.index + 1) + ' / 5人目 · 残りの質問 <b>' + state.remaining + ' / 8</b>' :
          state.phase === 'verdict' ? '最終回答' : '答え合わせ'}</p>
        ${button('note', showNote ? 'ゲーム画面へ戻る' : '推理ノート')}${button('rules', '公開ルール')}</header>
        <aside id="rules" class="panel" hidden><h2>公開ルール</h2><ul>${state.rules.map(rule => '<li>' + escape(rule) + '</li>').join('')}</ul></aside>
        ${state.publicRecord ? '<p class="public-record">' + escape(state.publicRecord) + '</p>' : ''}
        ${showNote ? notebook(state) : state.phase === 'conversation' ? conversation(state) :
          state.phase === 'verdict' ? verdict(state) : result(state)}`;
    }
    if (focus) {
      const element = focus === 'note' ? root.querySelector('[data-act="note"]') :
        root.querySelector('.dialogue h2, main > section h2, main > section h1') || root.querySelector('h1');
      element.tabIndex = -1;
      element.focus({ preventScroll: true });
    }
  }

  function start() {
    game = Mansion.createGame(selectedCase);
    showNote = false;
    tab = 'result';
    for (const id of Object.keys(guesses)) delete guesses[id];
  }
  root.addEventListener('click', event => {
    const target = event.target.closest('button[data-act]');
    if (!target || target.disabled) return;
    const { act, value } = target.dataset;
    if (act === 'intro' || act === 'title') screen = act;
    else if (act === 'cases') { game = null; screen = 'intro'; }
    else if (act === 'start' || act === 'retry') {
      if (act === 'start') selectedCase = value;
      start();
    }
    else if (act === 'note') showNote = !showNote;
    else if (act === 'ask') game.ask(value);
    else if (act === 'next') game.next();
    else if (act === 'result' || act === 'explanation') tab = act;
    else if (act === 'rules') {
      const panel = root.querySelector('#rules');
      panel.hidden = !panel.hidden;
      target.setAttribute('aria-expanded', String(!panel.hidden));
      return;
    }
    render(act);
  });
  root.addEventListener('change', event => {
    const { mode, id } = event.target.dataset;
    if (mode === 'note') game.note(id, event.target.value);
    else if (mode === 'guess') guesses[id] = event.target.value;
  });
  root.addEventListener('submit', event => {
    if (event.target.id !== 'verdict') return;
    event.preventDefault();
    const choices = Object.fromEntries([...event.target.querySelectorAll('select')].map(select => [select.dataset.id, select.value]));
    if (game.submit(choices.you, choices)) render('result');
    else root.querySelector('#form-message').textContent = '自分の役職を選んでください。';
  });
  render();
})();
</script>
</body>
</html>
